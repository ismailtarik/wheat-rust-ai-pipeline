project:
  name: "wheat-rust-ai-pipeline"
  author: "Tarik Ismail"
  lab: "MDSET — Hassan First University, Settat"
  seed: 42

# ------------------------------------------------------------
# Kaggle Dataset
# ------------------------------------------------------------
kaggle:
  dataset_id: "kushagra3204/wheat-plant-diseases"
  download_path: "data/raw/raw"
  dataset_id: "tolgahayit/yellowrust19-yellow-rust-disease-in-wheat"
  download_path: "data/raw/YellowRust19"
  dataset_id: "yasserhessein/wheat-disease-dataset-small"
  download_path: "data/raw/ZenodoWheatSmall"
  dataset_id: "kushagra3204/wheat-plant-diseases"
  download_path: "data/raw/MendeleyWheat"
  dataset_id: "notebooks/RoboflowWheatRust"
  download_path: "/data/raw/RoboflowWheatRust"

# ------------------------------------------------------------
# Classes ciblées
# ------------------------------------------------------------
# Ce dataset est 100% Wheat (pas besoin de filtrer par plante).
#
# mode: "auto"   → toutes les classes du dataset sont utilisées
#                   automatiquement, quels que soient leurs noms exacts
#                   de dossier (recommandé pour ce dataset).
# mode: "manual" → seules les classes listées dans label_map sont gardées
#                   (comportement précédent, utile pour PlantVillage).
classes:
  target_plant: "Wheat"
  mode: "auto"
  label_map:
    # Utilisé seulement si mode = "manual".
    # Laisse vide ou complète après avoir vu les noms réels des dossiers
    # (affichés automatiquement à l'étape 1 du pipeline).
    Wheat___Yellow_Rust:  "Yellow_Rust"
    Wheat___Stripe_Rust:  "Yellow_Rust"
    Wheat___Brown_Rust:   "Brown_Rust"
    Wheat___Leaf_Rust:    "Brown_Rust"
    Wheat___Stem_Rust:    "Stem_Rust"
    Wheat___Black_Rust:   "Stem_Rust"
    Wheat___Healthy:      "Healthy"
  num_classes: "auto"   # calculé automatiquement si mode = "auto"

# ------------------------------------------------------------
# Preprocessing
# ------------------------------------------------------------
preprocessing:
  img_size: [256, 256]
  channels: 3
  normalization: "minmax"       # minmax → [0,1]
  noise_std: 0.02               # bruit gaussien terrain

# ------------------------------------------------------------
# Augmentation (train seulement)
# ------------------------------------------------------------
augmentation:
  enabled: true
  flip_horizontal: true
  flip_vertical: true
  brightness_delta: 0.2
  contrast_range: [0.8, 1.2]
  saturation_range: [0.8, 1.2]
  hue_delta: 0.05
  zoom_factor: 1.1              # crop depuis 110% de la taille

# ------------------------------------------------------------
# Split dataset
# ------------------------------------------------------------
split:
  train_ratio: 0.70
  val_ratio:   0.15
  test_ratio:  0.15
  stratify: true

# ------------------------------------------------------------
# Pipeline tf.data
# ------------------------------------------------------------
pipeline:
  batch_size: 32
  prefetch: true                # tf.data.AUTOTUNE

# ------------------------------------------------------------
# Chemins de sortie — Phase 1
# ------------------------------------------------------------
paths:
  raw_data:      "data/raw/WheatPlantDiseases"
  raw_data:      "data/raw/YellowRust19"
  raw_data:      "data/raw/ZenodoWheatSmall"
  raw_data:      "data/raw/MendeleyWheat"
  processed:     "data/processed"
  reports:       "data/reports"
  outputs:       "outputs"
  notebooks:     "notebooks"
  train_csv:     "data/processed/train.csv"
  val_csv:       "data/processed/val.csv"
  test_csv:      "data/processed/test.csv"
  metadata_json: "data/processed/metadata.json"

# ============================================================
# PHASE 2 — Modèles Baseline (Classification + Détection)
# ============================================================

phase2:
  # --------------------------------------------------------
  # Classification (CNN custom / ResNet50 / EfficientNetB0)
  # --------------------------------------------------------
  classification:
    models: ["cnn_custom", "resnet50", "efficientnetb0", "resnet50_tam", "efficientnetb0_tam"]
    epochs: 30
    learning_rate: 0.0001
    fine_tune_epochs: 10        # epochs supplémentaires en fine-tuning (transfer learning)
    fine_tune_lr: 0.00001
    early_stopping_patience: 5
    reduce_lr_patience: 3
    use_class_weights: true
 
    # Augmentation ciblée renforcée pour les classes minoritaires
    minority_augmentation:
      enabled: true
      # Classe considérée minoritaire si son nombre d'images < ce ratio
      # du nombre d'images de la classe majoritaire
      threshold_ratio: 0.5
      extra_augmentation_factor: 3   # x3 passages d'augmentation supplémentaires
 
  # --------------------------------------------------------
  # Détection (YOLO) — bounding boxes auto-générées
  # --------------------------------------------------------
  detection:
    model: "yolo11n.pt"          # yolo11n.pt (stable) ou yolo26n.pt (dernier modèle)
    epochs: 120                   # augmenté de 50 → 120 pour une vraie convergence
    imgsz: 512                    # augmenté de 256 → 512 (mieux capturer les petites lésions)
    batch: 8                      # réduit de 16 → 8 (compense la mémoire GPU pour imgsz=512)
    # Mode bbox : 'full_image' = bbox couvrant toute l'image (classification
    # déguisée en détection, en l'absence d'annotations réelles).
    bbox_mode: "full_image"
    bbox_margin: 0.05             # marge (%) retirée des bords de l'image
 
  paths:
    classification_outputs: "outputs/phase2_classification"
    detection_outputs: "outputs/phase2_detection"
    yolo_dataset: "data/processed/yolo_dataset"
 
# ============================================================
# PHASE 3 — Generative AI & Dataset Enrichment (Objectif 2)
# ============================================================
 
phase3:
  # --------------------------------------------------------
  # Sélection des classes minoritaires à enrichir
  # --------------------------------------------------------
  minority_selection:
    # Une classe est jugée minoritaire si son nombre d'images < ce ratio
    # du nombre d'images de la classe majoritaire (même logique que Phase 2)
    threshold_ratio: 0.5
 
  # --------------------------------------------------------
  # cGAN (Conditional GAN)
  # --------------------------------------------------------
  cgan:
    latent_dim: 128
    epochs: 3000                  # GANs s'entraînent en "steps"/epochs courts mais nombreux
    batch_size: 32
    g_learning_rate: 0.0002
    d_learning_rate: 0.0002
    beta_1: 0.5                   # paramètre Adam recommandé pour GANs
    label_smoothing: 0.1          # stabilise l'entraînement du discriminateur
    sample_interval: 200          # sauvegarde d'un aperçu d'images tous les N epochs
    n_samples_per_class: 200      # nombre d'images synthétiques à générer par classe
 
  # --------------------------------------------------------
  # VAE (Variational Autoencoder) conditionnel
  # --------------------------------------------------------
  vae:
    latent_dim: 128
    epochs: 100
    batch_size: 32
    learning_rate: 0.001
    kl_weight: 0.001              # poids du terme KL-divergence dans la loss
    n_samples_per_class: 200
 
  # --------------------------------------------------------
  # Évaluation des images générées
  # --------------------------------------------------------
  evaluation:
    compute_fid: true
    compute_ssim: true
    n_eval_samples: 100           # nombre d'images réelles/synthétiques comparées
 
  paths:
    outputs: "outputs/phase3_generative"
    synthetic_data: "data/processed/synthetic"
 
 
 
# ============================================================
# MERGE — Fusion des 5 datasets (WheatAI-Merged)
# ============================================================
 
merge:
  output: "data/merged"
 
  # ----------------------------------------------------------
  # Plafonnement des classes surreprésentées (cap)
  # Corrige le déséquilibre créé par la fusion (Yellow_Rust
  # dominait à 42% du dataset avec un ratio max/min de 78x).
  # Toutes les classes dépassant ce seuil sont sous-échantillonnées
  # aléatoirement ; les classes en dessous sont conservées intégralement.
  # Mettre à null pour désactiver le plafonnement.
  # ----------------------------------------------------------
  max_images_per_class: 3000
 
  # ----------------------------------------------------------
  # Chemins vers chaque dataset source
  # Adapter selon où tu les as placés dans ton Colab/Drive
  # ----------------------------------------------------------
  paths:
    ds1: "data/raw/data"                 # Wheat Plant Diseases — ton dossier actuel
    ds2: "data/raw/MendeleyWheat"        # Mendeley Bangladesh
    ds3: "data/raw/YellowRust19"         # Yellow Rust Hayit
    ds4: "data/raw/ZenodoWheatSmall"     # Zenodo Brown 2023
    # ds5 accepte UN chemin (str) ou PLUSIEURS (liste) — chaque source
    # Roboflow apporte son propre data.yaml avec ses propres noms/index
    # de classes ; ils sont automatiquement fusionnés et remappés vers
    # un référentiel de classes unique et cohérent.
    ds5:
      - "data/raw/RoboflowWheatRust"          # dataset déjà utilisé
      - "data/raw/RoboflowWheatDesease"       # wheat-desease (1886 images)
      - "data/raw/RoboflowWheatDatasset"      # wheat-datasset (Brown-rust/Healthy/Smut)
 
  # ----------------------------------------------------------
  # Fallback si aucun data.yaml Roboflow n'est trouvé dans une source
  # (les vrais noms/index sont TOUJOURS préférés quand disponibles)
  # ----------------------------------------------------------
  roboflow_classes:
    - "Yellow_Rust"
    - "Brown_Rust"
    - "Stem_Rust"
 
  # ----------------------------------------------------------
  # Oversampling (plancher) pour la détection YOLO — corrige le
  # déséquilibre entre classes détectées (ex: 'Healthy' dominait avec
  # 115 images test contre 53 pour Brown_Rust). Les images du TRAIN
  # contenant des instances d'une classe sous ce plancher sont dupliquées
  # (symlinks) jusqu'à atteindre le plancher, sans jamais toucher val/test
  # (pour ne pas fausser l'évaluation).
  # Mettre à null pour désactiver.
  # ----------------------------------------------------------
  yolo_min_instances_per_class: 300
 